<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda Digital - Cuentas Premium</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0d0f12; color: #fff; font-family: sans-serif; }
    .neon-border { border: 1px solid #22c55e; }
  </style>
</head>
<body class="pb-24">

  <!-- ENCABEZADO -->
  <header class="bg-[#13171d] p-4 sticky top-0 z-40 border-b border-gray-800 flex justify-between items-center">
    <div class="flex items-center gap-2">
      <i class="fa-solid fa-bolt text-green-500 text-xl"></i>
      <span class="font-bold text-lg tracking-wide">DIGITAL<span class="text-green-500">STORE</span></span>
    </div>
    <button onclick="toggleCarrito()" class="relative bg-gray-800 px-3 py-2 rounded-lg flex items-center gap-2 border border-gray-700">
      <i class="fa-solid fa-cart-shopping text-green-400"></i>
      <span id="cart-count" class="bg-green-500 text-black text-xs font-black rounded-full px-1.5 py-0.5">0</span>
    </button>
  </header>

  <!-- BANNER -->
  <section class="p-4 text-center">
    <span class="bg-green-500/10 text-green-400 text-xs px-3 py-1 rounded-full border border-green-500/30">● ACTIVO 24/7</span>
    <h1 class="text-2xl font-black mt-3 leading-tight">CUENTAS PREMIUM<br><span class="text-green-400">PIDE POR WHATSAPP</span></h1>
    <p class="text-gray-400 text-xs mt-1">Elige tus productos, abre tu carrito y coordina directo por WhatsApp.</p>
  </section>

  <!-- LISTA DE PRODUCTOS -->
  <main class="p-4 max-w-md mx-auto grid grid-cols-2 gap-3" id="productos-grid">
    <!-- Se llenan con JavaScript -->
  </main>

  <!-- MODAL CARRITO -->
  <div id="modal-carrito" class="fixed inset-0 bg-black/80 z-50 hidden flex items-end sm:items-center justify-center">
    <div class="bg-[#161b22] w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 border border-gray-800 max-h-[85vh] flex flex-col">
      <div class="flex justify-between items-center pb-3 border-b border-gray-800">
        <h3 class="font-bold text-lg flex items-center gap-2"><i class="fa-solid fa-cart-shopping text-green-400"></i> Tu Carrito</h3>
        <button onclick="toggleCarrito()" class="text-gray-400 hover:text-white text-xl">&times;</button>
      </div>
      
      <div id="items-carrito" class="py-4 overflow-y-auto space-y-3 flex-1 text-sm">
        <!-- Items del carrito -->
      </div>

      <div class="pt-3 border-t border-gray-800">
        <div class="flex justify-between text-base font-bold mb-4">
          <span>Total a pagar:</span>
          <span class="text-green-400" id="total-precio">S/ 0.00</span>
        </div>
        <button onclick="irAPagar()" class="w-full bg-green-500 hover:bg-green-600 text-black font-bold py-3 rounded-xl flex items-center justify-center gap-2">
          <i class="fa-solid fa-wallet"></i> Pagar pedido
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL DE PAGO YAPE / WHATSAPP -->
  <div id="modal-pago" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-[#161b22] w-full max-w-sm rounded-2xl p-5 border border-gray-800 text-center relative">
      <button onclick="cerrarPago()" class="absolute top-3 right-4 text-gray-400 hover:text-white text-2xl">&times;</button>
      <h3 class="font-black text-lg text-white mb-1">Pagar con Yape o Plin</h3>
      <p class="text-xs text-gray-400 mb-3">Escanea el QR o transfiere el monto exacto</p>

      <div class="bg-white p-3 rounded-xl inline-block mb-3">
        <!-- Reemplaza esta imagen por la foto de tu propio QR de Yape -->
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=YAPE_PAGO" alt="QR Yape" class="w-40 h-40 mx-auto">
      </div>

      <div class="bg-gray-900/80 p-3 rounded-lg border border-gray-800 text-left text-xs mb-4 space-y-1">
        <p><span class="text-gray-400">Número:</span> <b class="text-white">910 542 854</b></p>
        <p><span class="text-gray-400">Total a yapear:</span> <b class="text-green-400 text-sm" id="pago-total">S/ 0.00</b></p>
      </div>

      <button onclick="enviarWhatsApp()" class="w-full bg-[#25D366] hover:bg-green-600 text-black font-bold py-3 rounded-xl flex items-center justify-center gap-2">
        <i class="fa-brands fa-whatsapp text-lg"></i> Notificar mi pedido por WhatsApp
      </button>
    </div>
  </div>

  <script>
    const MI_TELEFONO = "51910542854";

    const productos = [
      { id: 1, nombre: "Gemini Pro", precio: 15.00, desc: "Cuenta personal / mes", icon: "fa-brain" },
      { id: 2, nombre: "Duolingo", precio: 12.00, desc: "Suscripción Super", icon: "fa-feather" },
      { id: 3, nombre: "Prime Video", precio: 10.00, desc: "Perfil privado 30 días", icon: "fa-film" },
      { id: 4, nombre: "YouTube", precio: 9.00, desc: "Premium sin anuncios", icon: "fa-play" }
    ];

    let carrito = [];

    function renderProductos() {
      const contenedor = document.getElementById("productos-grid");
      contenedor.innerHTML = productos.map(prod => `
        <div class="bg-[#161b22] border border-gray-800 rounded-xl p-3 flex flex-col justify-between">
          <div>
            <div class="w-full h-20 bg-gray-900 rounded-lg flex items-center justify-center mb-2 text-green-400 text-2xl">
              <i class="fa-solid ${prod.icon}"></i>
            </div>
            <h4 class="font-bold text-sm leading-tight text-white">${prod.nombre}</h4>
            <p class="text-[11px] text-gray-400 mt-1">${prod.desc}</p>
          </div>
          <div class="mt-3 flex items-center justify-between pt-2 border-t border-gray-800/60">
            <span class="font-bold text-green-400 text-sm">S/ ${prod.precio.toFixed(2)}</span>
            <button onclick="agregarAlCarrito(${prod.id})" class="bg-green-500 hover:bg-green-600 text-black text-xs font-bold px-2.5 py-1.5 rounded-lg flex items-center gap-1">
              <i class="fa-solid fa-plus"></i> Añadir
            </button>
          </div>
        </div>
      `).join('');
    }

    function agregarAlCarrito(id) {
      const prod = productos.find(p => p.id === id);
      carrito.push(prod);
      actualizarCarrito();
    }

    function eliminarDelCarrito(index) {
      carrito.splice(index, 1);
      actualizarCarrito();
    }

    function actualizarCarrito() {
      document.getElementById("cart-count").innerText = carrito.length;
      const contenedorItems = document.getElementById("items-carrito");
      
      if (carrito.length === 0) {
        contenedorItems.innerHTML = '<p class="text-center text-gray-500 py-6">Tu carrito está vacío</p>';
      } else {
        contenedorItems.innerHTML = carrito.map((item, index) => `
          <div class="flex justify-between items-center bg-gray-900 p-2.5 rounded-lg border border-gray-800">
            <div>
              <p class="font-bold text-white text-xs">${item.nombre}</p>
              <p class="text-green-400 font-bold text-xs">S/ ${item.precio.toFixed(2)}</p>
            </div>
            <button onclick="eliminarDelCarrito(${index})" class="text-red-400 hover:text-red-300 text-xs px-2 py-1">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
        `).join('');
      }

      const total = carrito.reduce((acc, item) => acc + item.precio, 0);
      document.getElementById("total-precio").innerText = `S/ ${total.toFixed(2)}`;
      document.getElementById("pago-total").innerText = `S/ ${total.toFixed(2)}`;
    }

    function toggleCarrito() {
      document.getElementById("modal-carrito").classList.toggle("hidden");
    }

    function irAPagar() {
      if (carrito.length === 0) {
        alert("Agrega al menos un producto a tu carrito.");
        return;
      }
      toggleCarrito();
      document.getElementById("modal-pago").classList.remove("hidden");
    }

    function cerrarPago() {
      document.getElementById("modal-pago").classList.add("hidden");
    }

    function enviarWhatsApp() {
      const total = carrito.reduce((acc, item) => acc + item.precio, 0);
      const lista = carrito.map((item, i) => `${i + 1}. ${item.nombre} (S/ ${item.precio.toFixed(2)})`).join('%0A');
      
      const mensaje = `Hola, quiero confirmar mi pedido:%0A%0A${lista}%0A%0A*Total:* S/ ${total.toFixed(2)}%0A*Método:* Yape / Plin%0A%0A_Adjunto comprobante a continuación..._`;
      
      const url = `https://wa.me/${MI_TELEFONO}?text=${mensaje}`;
      window.open(url, '_blank');
    }

    renderProductos();
    actualizarCarrito();
  </script>
</body>
</html>
